<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schurco PDF Editor</title>
<meta name="description" content="Browser-based PDF editor for Schurco Slurry staff — page management, redaction, and editing tools, entirely client-side." />
<meta name="theme-color" content="#15181A" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

<div class="app-shell">
  <div class="toolbar" id="toolbar"></div>
  <div class="body">
    <div class="sidebar" id="sidebar"></div>
    <div class="canvas-area" id="canvas-area"></div>
    <div class="properties-panel" id="properties-panel"></div>
  </div>
</div>

<input type="file" id="file-input" accept="application/pdf" multiple class="sr-only" aria-label="Open PDF file" />
<input type="file" id="open-file-input" accept="application/pdf" class="sr-only" aria-label="Open a PDF, replacing the current document" />
<input type="file" id="image-input" accept="image/png,image/jpeg" class="sr-only" aria-label="Choose replacement image" />

<div class="busy-overlay" id="busy-overlay" role="status" aria-live="polite">
  <div class="busy-card">
    <div class="spinner"></div>
    <span id="busy-message"></span>
  </div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
